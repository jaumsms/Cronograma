<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Data Engineer Roadmap</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F0F4FF;
    --bg2: #ffffff;
    --bg3: #E8EEFF;
    --border: #D6E0FF;
    --blue: #1B4FD8;
    --blue-light: #3B6EF8;
    --blue-dark: #0F2E8A;
    --text: #0F1B3D;
    --text2: #4A5578;
    --muted: #8892B0;
    --c1: #1B4FD8;
    --c2: #0EA5E9;
    --c3: #7C3AED;
    --c4: #059669;
    --c5: #DC2626;
    --shadow: 0 1px 3px rgba(27,79,216,0.08), 0 4px 16px rgba(27,79,216,0.06);
    --shadow-hover: 0 4px 12px rgba(27,79,216,0.15), 0 8px 32px rgba(27,79,216,0.1);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, #0F2E8A 0%, #1B4FD8 50%, #3B6EF8 100%);
    padding: 52px 24px 40px;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 300px; height: 300px;
    background: rgba(255,255,255,0.05);
    border-radius: 50%;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: -80px; left: -40px;
    width: 200px; height: 200px;
    background: rgba(255,255,255,0.04);
    border-radius: 50%;
  }
  .header-inner { max-width: 720px; margin: 0 auto; position: relative; z-index: 1; }

  .tag {
    display: inline-block;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .18em;
    padding: 5px 12px;
    border-radius: 99px;
    margin-bottom: 20px;
  }

  h1 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: clamp(30px, 7vw, 46px);
    font-weight: 800;
    line-height: 1.1;
    color: #fff;
    letter-spacing: -.02em;
    margin-bottom: 10px;
  }
  h1 span { color: #93C5FD; }

  .subtitulo {
    font-size: 13px;
    color: rgba(255,255,255,0.6);
    letter-spacing: .03em;
    margin-bottom: 32px;
  }

  /* STATS ROW */
  .stats-row {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .stat-pill {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    padding: 8px 14px;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
  }
  .stat-pill span { opacity: .65; font-weight: 400; margin-right: 4px; }

  /* PROGRESSO GERAL */
  .prog-box {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 14px;
    padding: 20px 24px;
    backdrop-filter: blur(10px);
  }
  .prog-topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .prog-label { font-size: 11px; color: rgba(255,255,255,0.65); letter-spacing: .1em; font-weight: 600; }
  .prog-pct { font-size: 26px; font-weight: 800; color: #fff; }
  .barra-fundo { height: 8px; background: rgba(255,255,255,0.15); border-radius: 99px; overflow: hidden; }
  .barra-fill {
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, #93C5FD, #60A5FA, #3B82F6);
    transition: width .6s cubic-bezier(.4,0,.2,1);
  }
  .prog-sub { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 8px; }

  /* FILTRO */
  .filtro-wrapper {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 24px 0;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .filtro-label { font-size: 11px; color: var(--muted); letter-spacing: .1em; font-weight: 600; flex-shrink: 0; }
  .filtro-scroll { display: flex; gap: 6px; flex-wrap: wrap; }
  .filtro-btn {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text2);
    font-size: 11px;
    font-weight: 600;
    padding: 5px 12px;
    cursor: pointer;
    font-family: inherit;
    transition: all .2s;
    box-shadow: 0 1px 2px rgba(27,79,216,0.05);
  }
  .filtro-btn:hover { border-color: var(--blue-light); color: var(--blue); }
  .filtro-btn.ativo {
    background: var(--blue);
    border-color: var(--blue);
    color: #fff;
    box-shadow: 0 2px 8px rgba(27,79,216,0.25);
  }

  /* CORPO */
  .corpo {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 24px 64px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* FASE CARD */
  .fase-card {
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    background: var(--bg2);
    box-shadow: var(--shadow);
    transition: box-shadow .2s;
  }
  .fase-card:hover { box-shadow: var(--shadow-hover); }

  .fase-header {
    width: 100%;
    background: transparent;
    border: none;
    border-left: 4px solid;
    padding: 18px 20px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    text-align: left;
    font-family: inherit;
    gap: 12px;
    transition: background .2s;
  }
  .fase-header:hover { background: var(--bg3); }

  .fase-esq { flex: 1; }
  .fase-num { font-size: 10px; font-weight: 700; letter-spacing: .2em; margin-bottom: 3px; }
  .fase-titulo { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 2px; font-family: 'Plus Jakarta Sans', sans-serif; }
  .fase-semanas { font-size: 11px; color: var(--muted); }

  .fase-dir { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; min-width: 64px; }
  .fase-pct { font-size: 17px; font-weight: 800; }
  .mini-barra-fundo { width: 60px; height: 4px; background: var(--bg3); border-radius: 99px; overflow: hidden; }
  .mini-barra-fill { height: 100%; border-radius: 99px; transition: width .4s ease; }
  .chevron { font-size: 10px; color: var(--muted); transition: transform .3s ease; }
  .chevron.aberto { transform: rotate(180deg); }

  /* CORPO DA FASE */
  .fase-corpo { padding: 0 16px 16px; display: flex; flex-direction: column; }
  .fase-corpo.hidden { display: none; }

  .sem-grupo-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: .15em;
    font-weight: 700;
    margin: 14px 0 6px 4px;
    text-transform: uppercase;
  }

  /* TÓPICO ITEM */
  .topico-item {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    text-align: left;
    font-family: inherit;
    transition: all .2s ease;
    margin-bottom: 6px;
  }
  .topico-item:hover { background: var(--bg3); border-color: #BFCFFF; transform: translateX(2px); }
  .topico-item.feito { border-left-width: 3px; border-left-style: solid; background: #fff; }

  .check-box {
    width: 20px;
    height: 20px;
    border-radius: 6px;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
    transition: all .2s;
    font-size: 11px;
    font-weight: 900;
    color: #fff;
  }

  .topico-texto { font-size: 13px; line-height: 1.5; color: var(--text2); transition: all .2s; font-weight: 500; }
  .topico-item.feito .topico-texto { text-decoration: line-through; color: var(--muted); }
  .topico-fase-label { font-size: 10px; letter-spacing: .1em; font-weight: 700; margin-bottom: 2px; text-transform: uppercase; }

  /* SEMANA VIEW */
  .semana-view { display: flex; flex-direction: column; gap: 6px; }
  .semana-titulo {
    font-size: 13px; color: var(--text2); letter-spacing: .05em;
    font-weight: 700; margin-bottom: 12px;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }

  /* FOOTER */
  footer {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    padding: 0 24px 40px;
    letter-spacing: .05em;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="tag">6 MESES · ANALISTA → ENGENHEIRO DE DADOS</div>
    <h1>Data Engineer<br><span>Roadmap</span></h1>
    <p class="subtitulo">S&OP Analyst → Data Engineer · AWS · Pipelines · Spark</p>
    <div class="stats-row">
      <div class="stat-pill"><span>Duração</span>24 semanas</div>
      <div class="stat-pill"><span>Tópicos</span>44 itens</div>
      <div class="stat-pill"><span>Fases</span>5 etapas</div>
    </div>
    <div class="prog-box">
      <div class="prog-topo">
        <span class="prog-label">PROGRESSO GERAL</span>
        <span class="prog-pct" id="pct-geral">0%</span>
      </div>
      <div class="barra-fundo"><div class="barra-fill" id="barra-geral" style="width:0%"></div></div>
      <div class="prog-sub" id="prog-sub">0 de 44 tópicos concluídos</div>
    </div>
  </div>
</div>

<div class="filtro-wrapper">
  <span class="filtro-label">SEMANA:</span>
  <div class="filtro-scroll" id="filtro-scroll"></div>
</div>

<div class="corpo" id="corpo"></div>

<footer>Sua jornada · Analista S&OP → Engenheiro de Dados</footer>

<script>
const COR = ["#1B4FD8","#0EA5E9","#7C3AED","#059669","#DC2626"];

const ROADMAP = [
  {
    fase:1, titulo:"Fundamentos de Engenharia de Dados", semanas:"Semanas 1–3", cor:COR[0],
    topicos:[
      {id:"1-1",semana:1,titulo:"Modelagem de dados (Star Schema, Snowflake)"},
      {id:"1-2",semana:1,titulo:"Data Warehouse vs Data Lake vs Lakehouse"},
      {id:"1-3",semana:2,titulo:"Conceitos de ETL/ELT e pipelines de dados"},
      {id:"1-4",semana:2,titulo:"Formatos de arquivo: Parquet, Avro, ORC, JSON"},
      {id:"1-5",semana:3,titulo:"SQL avançado: CTEs, Window Functions, Partitioning"},
      {id:"1-6",semana:3,titulo:"Python para dados: Pandas avançado, type hints, virtual envs"},
    ]
  },
  {
    fase:2, titulo:"Cloud — AWS para Engenharia de Dados", semanas:"Semanas 4–8", cor:COR[1],
    topicos:[
      {id:"2-1",semana:4,titulo:"IAM, S3, VPC — fundamentos de cloud"},
      {id:"2-2",semana:4,titulo:"AWS S3 como Data Lake: particionamento e lifecycle"},
      {id:"2-3",semana:5,titulo:"AWS Glue: Crawlers, Data Catalog e ETL Jobs"},
      {id:"2-4",semana:5,titulo:"Amazon Athena: SQL sobre S3 com Presto"},
      {id:"2-5",semana:6,titulo:"AWS Redshift: configuração, COPY, distribuição"},
      {id:"2-6",semana:6,titulo:"RDS e DynamoDB — quando usar cada um"},
      {id:"2-7",semana:7,titulo:"AWS Lambda para pipelines serverless"},
      {id:"2-8",semana:7,titulo:"Amazon Kinesis: streaming de dados em tempo real"},
      {id:"2-9",semana:8,titulo:"Simulado e revisão para AWS Cloud Practitioner"},
      {id:"2-10",semana:8,titulo:"Projeto prático: pipeline S3 → Glue → Athena → QuickSight"},
    ]
  },
  {
    fase:3, titulo:"Pipelines & Orquestração", semanas:"Semanas 9–14", cor:COR[2],
    topicos:[
      {id:"3-1",semana:9,titulo:"Apache Airflow: DAGs, Operators, XComs"},
      {id:"3-2",semana:9,titulo:"dbt (data build tool): models, tests, lineage"},
      {id:"3-3",semana:10,titulo:"dbt avançado: macros, snapshots, seeds"},
      {id:"3-4",semana:10,titulo:"Qualidade de dados: Great Expectations"},
      {id:"3-5",semana:11,titulo:"Docker para engenharia de dados"},
      {id:"3-6",semana:11,titulo:"Containers na AWS: ECS e ECR básico"},
      {id:"3-7",semana:12,titulo:"CI/CD para pipelines: GitHub Actions"},
      {id:"3-8",semana:12,titulo:"Infrastructure as Code: Terraform básico para AWS"},
      {id:"3-9",semana:13,titulo:"Projeto: pipeline Airflow + dbt + S3 + Redshift"},
      {id:"3-10",semana:14,titulo:"Code review do projeto + documentação"},
    ]
  },
  {
    fase:4, titulo:"Spark & Processamento Distribuído", semanas:"Semanas 15–20", cor:COR[3],
    topicos:[
      {id:"4-1",semana:15,titulo:"Fundamentos do Apache Spark: RDD, DataFrame, Dataset"},
      {id:"4-2",semana:15,titulo:"PySpark: transformações, ações e lazy evaluation"},
      {id:"4-3",semana:16,titulo:"Spark SQL e integração com Hive Metastore"},
      {id:"4-4",semana:16,titulo:"Otimização: particionamento, cache, broadcast joins"},
      {id:"4-5",semana:17,titulo:"Spark Streaming e Structured Streaming"},
      {id:"4-6",semana:17,titulo:"Delta Lake: ACID transactions sobre Spark"},
      {id:"4-7",semana:18,titulo:"AWS EMR: cluster Spark gerenciado na nuvem"},
      {id:"4-8",semana:18,titulo:"Databricks Community Edition: notebooks e workflows"},
      {id:"4-9",semana:19,titulo:"Projeto: pipeline Spark no EMR com Delta Lake"},
      {id:"4-10",semana:20,titulo:"Revisão geral + simulado AWS Data Engineer Associate"},
    ]
  },
  {
    fase:5, titulo:"Portfólio & Transição", semanas:"Semanas 21–24", cor:COR[4],
    topicos:[
      {id:"5-1",semana:21,titulo:"GitHub: organizar projetos com README profissional"},
      {id:"5-2",semana:21,titulo:"Projeto final integrador: end-to-end pipeline completo"},
      {id:"5-3",semana:22,titulo:"LinkedIn: reposicionamento de perfil para DE"},
      {id:"5-4",semana:22,titulo:"Preparação para entrevistas técnicas de DE"},
      {id:"5-5",semana:23,titulo:"Mock interviews: SQL avançado e system design"},
      {id:"5-6",semana:23,titulo:"Networking: comunidades (Data Hackers, Slack groups)"},
      {id:"5-7",semana:24,titulo:"Revisão final do portfólio e candidaturas ativas"},
      {id:"5-8",semana:24,titulo:"🎯 Meta: primeira vaga como Engenheiro de Dados"},
    ]
  },
];

const STORAGE_KEY = "de_roadmap_v2";
let progress = {};
try { progress = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch {}

let filtroSemana = null;
let faseAberta = 1;

function salvar() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); } catch {}
}

function totalFeitos() {
  return ROADMAP.flatMap(f => f.topicos).filter(t => progress[t.id]).length;
}

function atualizarProgresso() {
  const feitos = totalFeitos();
  const total = 44;
  const pct = Math.round((feitos / total) * 100);
  document.getElementById("pct-geral").textContent = pct + "%";
  document.getElementById("barra-geral").style.width = pct + "%";
  document.getElementById("prog-sub").textContent = feitos + " de " + total + " tópicos concluídos";
  ROADMAP.forEach(fase => {
    const f = fase.topicos.filter(t => progress[t.id]).length;
    const p = Math.round((f / fase.topicos.length) * 100);
    const pEl = document.getElementById("fase-pct-" + fase.fase);
    const bEl = document.getElementById("fase-bar-" + fase.fase);
    if (pEl) pEl.textContent = p + "%";
    if (bEl) bEl.style.width = p + "%";
  });
}

function toggleItem(id) {
  progress[id] = !progress[id];
  salvar();
  const btn = document.querySelector(`[data-id="${id}"]`);
  if (!btn) return;
  const cor = btn.dataset.cor;
  const checkBox = btn.querySelector(".check-box");
  const texto = btn.querySelector(".topico-texto");
  if (progress[id]) {
    btn.classList.add("feito");
    btn.style.borderLeftColor = cor;
    checkBox.style.background = cor;
    checkBox.style.borderColor = cor;
    checkBox.textContent = "✓";
    texto.style.textDecoration = "line-through";
    texto.style.color = "#8892B0";
  } else {
    btn.classList.remove("feito");
    btn.style.borderLeftColor = "#D6E0FF";
    checkBox.style.background = "transparent";
    checkBox.style.borderColor = "#D6E0FF";
    checkBox.textContent = "";
    texto.style.textDecoration = "none";
    texto.style.color = "#4A5578";
  }
  atualizarProgresso();
}

function criarTopicoEl(topico, cor, showFase, faseTitulo) {
  const btn = document.createElement("button");
  const feito = !!progress[topico.id];
  btn.className = "topico-item" + (feito ? " feito" : "");
  btn.dataset.id = topico.id;
  btn.dataset.cor = cor;
  if (feito) btn.style.borderLeftColor = cor;

  const check = document.createElement("div");
  check.className = "check-box";
  check.style.borderColor = feito ? cor : "#D6E0FF";
  check.style.background = feito ? cor : "transparent";
  check.textContent = feito ? "✓" : "";

  const wrap = document.createElement("div");

  if (showFase) {
    const fl = document.createElement("div");
    fl.className = "topico-fase-label";
    fl.style.color = cor;
    fl.textContent = faseTitulo;
    wrap.appendChild(fl);
  }

  const txt = document.createElement("div");
  txt.className = "topico-texto";
  txt.textContent = topico.titulo;
  if (feito) { txt.style.textDecoration = "line-through"; txt.style.color = "#8892B0"; }
  wrap.appendChild(txt);

  btn.appendChild(check);
  btn.appendChild(wrap);
  btn.addEventListener("click", () => toggleItem(topico.id));
  return btn;
}

function renderFiltro() {
  const scroll = document.getElementById("filtro-scroll");
  scroll.innerHTML = "";
  const semanas = [...new Set(ROADMAP.flatMap(f => f.topicos.map(t => t.semana)))].sort((a,b)=>a-b);

  const btnAll = document.createElement("button");
  btnAll.className = "filtro-btn" + (filtroSemana === null ? " ativo" : "");
  btnAll.textContent = "Todas";
  btnAll.addEventListener("click", () => { filtroSemana = null; render(); });
  scroll.appendChild(btnAll);

  semanas.forEach(s => {
    const btn = document.createElement("button");
    btn.className = "filtro-btn" + (filtroSemana === s ? " ativo" : "");
    btn.textContent = "S" + s;
    btn.addEventListener("click", () => { filtroSemana = s; render(); });
    scroll.appendChild(btn);
  });
}

function renderCorpo() {
  const corpo = document.getElementById("corpo");
  corpo.innerHTML = "";

  if (filtroSemana !== null) {
    const view = document.createElement("div");
    view.className = "semana-view";
    const titulo = document.createElement("div");
    titulo.className = "semana-titulo";
    titulo.textContent = "Semana " + filtroSemana;
    view.appendChild(titulo);
    ROADMAP.forEach(fase => {
      fase.topicos.filter(t => t.semana === filtroSemana).forEach(t => {
        view.appendChild(criarTopicoEl(t, fase.cor, true, fase.titulo));
      });
    });
    corpo.appendChild(view);
    return;
  }

  ROADMAP.forEach(fase => {
    const card = document.createElement("div");
    card.className = "fase-card";

    const header = document.createElement("button");
    header.className = "fase-header";
    header.style.borderLeftColor = fase.cor;

    const feitos = fase.topicos.filter(t => progress[t.id]).length;
    const pct = Math.round((feitos / fase.topicos.length) * 100);
    const aberta = faseAberta === fase.fase;

    header.innerHTML = `
      <div class="fase-esq">
        <div class="fase-num" style="color:${fase.cor}">FASE ${fase.fase}</div>
        <div class="fase-titulo">${fase.titulo}</div>
        <div class="fase-semanas">${fase.semanas}</div>
      </div>
      <div class="fase-dir">
        <div class="fase-pct" id="fase-pct-${fase.fase}" style="color:${fase.cor}">${pct}%</div>
        <div class="mini-barra-fundo">
          <div class="mini-barra-fill" id="fase-bar-${fase.fase}" style="width:${pct}%;background:${fase.cor}"></div>
        </div>
        <div class="chevron ${aberta ? 'aberto' : ''}">▼</div>
      </div>
    `;

    const corpo2 = document.createElement("div");
    corpo2.className = "fase-corpo" + (aberta ? "" : " hidden");

    const semanasUnicas = [...new Set(fase.topicos.map(t => t.semana))];
    semanasUnicas.forEach(sem => {
      const label = document.createElement("div");
      label.className = "sem-grupo-label";
      label.textContent = "Semana " + sem;
      corpo2.appendChild(label);
      fase.topicos.filter(t => t.semana === sem).forEach(t => {
        corpo2.appendChild(criarTopicoEl(t, fase.cor, false, ""));
      });
    });

    header.addEventListener("click", () => {
      faseAberta = faseAberta === fase.fase ? null : fase.fase;
      render();
    });

    card.appendChild(header);
    card.appendChild(corpo2);
    corpo.appendChild(card);
  });
}

function render() {
  renderFiltro();
  renderCorpo();
  atualizarProgresso();
}

render();
</script>
</body>
</html>
